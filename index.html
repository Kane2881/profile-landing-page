    <title>kzy | Profile</title>

  <body>
    <header>
      <div class="wrapper">
        <div class="logo-container">
          <p class="logo">
            <a class="logo-link | ff-accent fs-800" href="index.html">kzy</a>
          </p>
        </div>
        <nav class="primary-nav">
          <ul class="nav-lists" role="list">
            <li class="nav-list">
              <a href="index.html" class="nav-link">Home</a>
            </li>
            <li class="nav-list">
              <a href="about.html" class="nav-link">About</a>
            </li>
            <li class="nav-list">
              <a href="hobby.html" class="nav-link">Hobby</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <div class="wrapper">
        <section class="hero-section">
          <div class="hero-content | grid">
            <h1 class="hero-content-title | fw-regular fs-700">
              はじめまして！
              <br />
              <span class="text-big | fw-semi-bold fs-900">チョーゼイヤ</span>
              <br />
              と申します。
            </h1>
            <p class="hero-content-description">
              フルスタックエンジニアを目指して、日本でプログラミングを学んでいます。
            </p>
            <a href="about.html" class="link-btn">もっと見る</a>
          </div>

          <img src="" alt="" class="hero-avatar" />
        </section>

        <section class="hobby-section">
          <h2 class="hobby-title | ff-secondary fw-bold text-center">Hobby</h2>

          <div class="cards-container | grid">
            <!--Dota 2-->
            <div class="card dota | grid">
              <p class="card-title | ff-secondary fw-bold">Dota 2</p>
              <div class="card-content-container | grid">
                <div class="card-img">
                  <img src="images/dota.jpg" alt="" />
                </div>
                <div class="card-contents | flow text-start">
                  <h4 class="card-content-heading | fs-500">
                    ゲームの中でDota 2 が一番好き
                  </h4>
                  <p class="card-content-description">
                    小学生の頃からずっとやってきたゲーム Dota 2
                  </p>
                </div>
              </div>
            </div>

            <!--Workout-->
            <div class="card workout | grid">
              <p class="card-title | ff-secondary fw-bold">Workout</p>
              <div class="card-content-container | grid">
                <div class="card-img">
                  <img src="images/workout.jpg" alt="" />
                </div>
                <div class="card-contents | flow text-start">
                  <h4 class="card-content-heading | fs-500">
                    筋トレするのが好き
                  </h4>
                  <p class="card-content-description">
                    ルーティンを変えたいからジムに通い始め、好きになった
                  </p>
                </div>
              </div>
            </div>

            <!--YouTube-->
            <div class="card youtube | grid">
              <p class="card-title | ff-secondary fw-bold">YouTube</p>
              <div class="card-content-container | grid">
                <div class="card-img">
                  <img src="images/youtube.png" alt="" />
                </div>
                <div class="card-contents | flow text-start">
                  <h4 class="card-content-heading | fs-500">
                    YouTubeで動画を見るのが好き　
                  </h4>
                  <p class="card-content-description">
                    なんでもYouTubeに載ってる動画から始まった
                  </p>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
